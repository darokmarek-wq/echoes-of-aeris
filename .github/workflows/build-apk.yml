name: Build Echoes of Aeris APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  EXPORT_NAME: EchoesOfAeris

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          apt-get update
          apt-get install -y unzip python3 ca-certificates
          rm -rf aeris_godot
          unzip -q Echoes_of_Aeris_Godot_4.7.1_Android.zip

          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' aeris_godot/project.godot

          echo "Android texture compression setting:"
          grep "import_etc2_astc" aeris_godot/project.godot

      - name: Setup Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config

          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi

          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Download high quality assets
        shell: bash
        working-directory: aeris_godot
        run: |
          python3 tools/fetch_assets.py || true

      - name: Import Godot project
        shell: bash
        working-directory: aeris_godot
        run: |
          godot --headless --verbose --editor --quit

      - name: Build APK
        shell: bash
        working-directory: aeris_godot
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfAeris-Android-APK
          path: aeris_godot/build/android/EchoesOfAeris.apk
          if-no-files-found: error
